<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trenout</title>
<meta name="theme-color" content="#1d57c9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: canteiro — lista de obras > cômodo com abas; leitor da trena fixo no rodapé, sempre à mão */
:root{
  --bg:#e9ece8; --surface:#f7f8f5; --sunk:#dfe3de; --ink:#19201d; --muted:#5b6661; --line:#c4cbc5;
  --accent:#1d57c9; --accent-ink:#ffffff; --laser:#c9321b; --ok:#2b7a4b; --warn:#a86300;
  --lcd:#d7e2cf; --lcd-ink:#17240f;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201e; --sunk:#0d100f; --ink:#e4e9e5; --muted:#97a29d; --line:#323a36;
  --accent:#6d98ff; --accent-ink:#0b1430; --laser:#ff6a50; --ok:#5cc489; --warn:#f0a83a;
  --lcd:#1f2a1b; --lcd-ink:#c8f0a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201e; --sunk:#0d100f; --ink:#e4e9e5; --muted:#97a29d; --line:#323a36;
  --accent:#6d98ff; --accent-ink:#0b1430; --laser:#ff6a50; --ok:#5cc489; --warn:#f0a83a;
  --lcd:#1f2a1b; --lcd-ink:#c8f0a8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 210px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font:700 22px/1.1 var(--f-disp);letter-spacing:.02em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.prow{display:flex;gap:8px;align-items:stretch}.prow .item{flex:1;min-width:0}.prow .del{align-self:center}
#ttl.ed{cursor:pointer}#ttl.ed::after{content:" ✎";font-size:.7em;opacity:.55}
#ttlin{flex:1;min-width:0;font:700 20px/1.1 var(--f-disp);text-transform:uppercase}
.sheetbg{position:fixed;inset:0;z-index:25;background:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:26;max-height:52vh;overflow-y:auto;background:var(--surface);border-top:2px solid var(--ink);border-radius:14px 14px 0 0;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.sheethd{position:sticky;top:-12px;background:var(--surface);padding-block:6px;z-index:1}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer}
h2{font:600 18px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.list{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.del{color:var(--laser)}
.btn.arm{background:var(--laser);border-color:var(--laser);color:#fff}
.btn:focus-visible,.mf:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.txt,select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0}
input.txt{width:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px 0 4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font:600 15px var(--f-disp);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.item b{font:600 17px var(--f-disp);letter-spacing:.02em}
.item .sub{color:var(--muted);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* campo de medida */
.mf{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;min-width:92px;cursor:pointer;text-align:left}
.mf .mfl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mf .mfv{font:700 17px var(--f-num);font-variant-numeric:tabular-nums}
.mf.empty .mfv{color:var(--muted)}
.mf.on{border-color:var(--laser);box-shadow:0 0 0 3px color-mix(in srgb,var(--laser) 22%,transparent)}
.mf.on .mfl{color:var(--laser)}
.wall{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.wall:last-child{border-bottom:0}
.tag{font:700 13px var(--f-num);background:var(--sunk);border-radius:6px;padding:4px 7px;min-width:36px;text-align:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font:700 20px var(--f-num)}
.stat b i{font-style:normal;font-size:12px;color:var(--muted);margin-left:3px}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.warnbox{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));padding:8px 12px;border-radius:6px;font-size:13px}
.okbox{border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));padding:8px 12px;border-radius:6px;font-size:13px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.plan-empty{padding:30px 16px;text-align:center;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
tfoot td{font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;text-align:left}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk)}
.thumb span{display:block;padding:6px 8px;font-size:13px}
.stage{position:relative;overflow:hidden;width:100%;background:var(--sunk);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.loupe{position:fixed;z-index:30;width:160px;height:160px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.45);pointer-events:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.chip{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.chip.on{outline:3px solid var(--accent);outline-offset:1px}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.drow{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}
.wk{min-width:44px;font-size:12px;padding:5px 6px}.wk-s{border-style:dashed;color:var(--muted)}.wk-v{border-style:dashed;border-color:var(--laser);color:var(--laser)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px;flex:none}
.ctag{font-size:13px;min-width:24px}
.cs{padding:5px 2px;font-size:13px;flex:0 1 86px;min-width:0}
.mf.cmp,.dim .mf{min-width:0;flex:0 1 76px;padding:2px 7px}
.dim .mf .mfv,.dim .pin{font-size:15px}.dim .pin{width:100%}
.dim .mfl{font-size:10px}
.xb{padding:4px 8px;margin-left:auto;flex:none}.dim .pill{flex:none}.dim .sw{flex:none}
.dl{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.dmore{padding-top:8px;border-top:1px dashed var(--line);margin-top:6px}
.dim .minis{margin-top:6px}
.dim .pill{padding:2px 7px;font-size:12px}
details.opt{margin-top:10px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
details.opt summary{font-weight:500}
.dim.sel{border-color:var(--laser);box-shadow:0 0 0 2px color-mix(in srgb,var(--laser) 25%,transparent)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);flex:none}
.pin{border:0;background:none;padding:0;font:700 17px var(--f-num);width:96px;min-width:0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font:700 13px var(--f-num);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--laser) 18%,transparent);color:var(--laser)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.tw{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:64px;height:48px;cursor:pointer;background:var(--sunk)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.confirm{color:#fff!important;background:var(--laser)!important;border-color:var(--laser)!important}
/* leitor da trena */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--ink);
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
#dock .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:6px 12px;display:flex;align-items:baseline;gap:8px;min-width:0}
.lcd #rv{font:700 32px/1.1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lcd small{font:600 14px var(--f-num)}
.lcd.flash{animation:fl .5s}
@keyframes fl{0%{background:var(--laser);color:#fff}100%{}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;align-self:center}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.busy{background:var(--warn)}
#tgt{grid-column:1/-1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tgt b{color:var(--laser)}
.man{grid-column:1/-1;display:flex;gap:6px}
.man input{flex:1;min-width:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:190px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
details summary{cursor:pointer;font-weight:600}
pre.log{font:11px/1.4 var(--f-num);background:var(--sunk);padding:8px;border-radius:6px;overflow-x:auto;max-height:200px}
@media (prefers-reduced-motion:reduce){.lcd.flash{animation:none}}
/* relatório / impressão */
.rep h1{font:700 26px var(--f-disp);text-transform:uppercase;margin:16px 0 2px}
.rep .room{break-inside:avoid;margin-top:18px}
.rep .room h3{font:600 18px var(--f-disp);text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--ink)}
.rep .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.rep .two{grid-template-columns:1fr}}
.rep .crops{display:grid;gap:10px}.rep .crops figure{break-inside:avoid}
.rep img{width:100%;border-radius:6px;border:1px solid var(--line)}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#999;color-scheme:light}
  header.top,#dock,.noprint,#toast{display:none!important}
  .wrap{padding:0;max-width:none}
}
</style>
</head>
<body>
<header class="top"><button class="back" id="back" type="button" aria-label="Voltar" hidden>‹</button><h1 id="ttl">Trenout</h1><input class="txt" id="ttlin" hidden aria-label="Nome"><button class="back" id="gear" type="button" aria-label="Ajustes">⚙</button></header>
<main class="wrap" id="app"></main>

<div id="dock">
  <div class="in">
    <div class="lcd" id="lcd"><span class="dot" id="dot"></span><span id="rv">—</span><small id="runit">m</small></div>
    <button class="btn pri" id="bt" type="button">Conectar trena</button>
    <div id="tgt"></div>
    <div class="man"><input class="txt num" id="man" inputmode="decimal" placeholder="ou digite a medida (m)" autocomplete="off"><button class="btn" id="manok" type="button">OK</button></div>
  </div>
</div>
<div id="toast" hidden></div>
<input type="file" id="fileph" accept="image/*" capture="environment" hidden>
<input type="file" id="fileplan" accept="application/pdf,.pdf,image/*" hidden>
<canvas id="loupe" class="loupe" hidden></canvas>
<input type="file" id="filejs" accept="application/json,.json" hidden>

<script>
'use strict';
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=2)=>(n==null||!isFinite(n))?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pn=s=>{if(s==null)return null;s=String(s).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;const v=parseFloat(s);return isFinite(v)?v:null};
const FMTS={m3:{k:1,d:3,s:'m',n:'Metros · 0,000'},cm1:{k:100,d:1,s:'cm',n:'Centímetros · 0,0'},mm:{k:1000,d:0,s:'mm',n:'Milímetros · 0'}};
const UF=()=>FMTS[(typeof S!=='undefined'&&S&&S.settings.fmt)||'m3']||FMTS.m3;
const UN=()=>UF().s,fl=v=>(v==null||!isFinite(v))?'—':nf(v*UF().k,UF().d),flu=v=>fl(v)+' '+UN(),parseL=t=>{const v=pn(t);return v==null?null:v/UF().k};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ===== dados ===== */
const KEY='cotalaser.v1';
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.projects)){S={projects:[],free:[],settings:{minOpen:0,dec:3}};seed()}
  S.free=S.free||[];S.settings=Object.assign({minOpen:0,dec:3,tol:1,vib:true,wake:true},S.settings||{});for(const p of S.projects)for(const r of p.rooms||[]){delete r.extras;for(const sc of r.sancas||[])if(sc.wall!=null&&sc.corner==null){sc.corner=sc.wall;sc.a=sc.len||null;sc.b=0;delete sc.wall;delete sc.len;delete sc.off}}if(!S.settings.fmt||!FMTS[S.settings.fmt])S.settings.fmt=S.settings.fmt==='cm0'?'cm1':'m3';S.settings.dec=3;
  for(const p of S.projects)for(const f of p.photos||[]){f.kind=f.kind||'photo';f.dims=(f.dims||[]).map(d=>Object.assign({id:uid(),ph:[]},d))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar no aparelho (memória cheia?)')}}
function newRoom(name){return{id:uid(),name,mode:'rect',a:null,b:null,h:null,walls:[{len:null,ang:90}],openings:[],objects:[]}}
function seed(){const r=newRoom('Sala (exemplo)');r.a=4.2;r.b=3.1;r.h=2.7;
  r.openings=[{id:uid(),t:'porta',w:0.8,h:2.1,q:1,wall:0},{id:uid(),t:'janela',w:1.5,h:1.2,q:1,wall:1}];
  const r2=newRoom('Quarto em L (exemplo)');r2.mode='poly';r2.h=2.6;
  r2.walls=[{len:4,ang:90},{len:3.5,ang:90},{len:1.5,ang:-90},{len:1,ang:90},{len:2.5,ang:90},{len:4.5,ang:90},{len:null,ang:90}];
  S.projects.push({id:uid(),name:'Obra exemplo — apague quando quiser',created:Date.now(),rooms:[r,r2],photos:[]});save()}
const P=id=>S.projects.find(p=>p.id===id);
const R=(p,id)=>p&&p.rooms.find(r=>r.id===id);

/* ===== geometria ===== */
const REVS=['Pintura','Cerâmica','Porcelanato','Azulejo','Pastilha','Textura','Papel de parede','Gesso liso','Pedra','Madeira','Outro'];
function WS(r,i){if(r.mode==='rect'){r.revR=r.revR||{};return r.revR[i]=r.revR[i]||{}}return r.walls[i]}
function revAreas(r){const g=geom(r),H=r.h||0,min=+S.settings.minOpen||0,rows=[],tot={},warn=[];if(!(H>0))return{rows,tot,warn:g.ws.length?['Sem pé-direito: revestimento não calculado.']:[]};
  const addT=(k,v)=>{if(v>1e-9)tot[k]=(tot[k]||0)+v};
  g.ws.forEach((w,i)=>{if(WK(w)!=='p')return;const st=WS(r,i)||{},h1=st.rvH>0?Math.min(st.rvH,H):H,len=w.len;let lo=len*h1,up=len*(H-h1);
    for(const o of r.openings){if(o.wall!==i||!(o.w>0&&o.h>0))continue;const q=o.q||1;if(o.w*o.h<=min)continue;
      let z0=o.t==='janela'?o.pe:0;if(z0==null){if(h1<H)warn.push('Janela em '+WN(r,i)+' sem peitoril: descontada da faixa de cima.');z0=h1<H?h1:0}
      const ov=Math.max(0,Math.min(z0+o.h,h1)-Math.max(z0,0));lo-=o.w*q*ov;up-=o.w*q*(o.h-ov)}
    for(const sc of r.sancas||[]){const q=scGeo(sc,g.ws);if(!q)continue;const L=(q.k===i?q.La:0)+(q.k2===i?q.Lb:0);if(!L)continue;const a=Math.min(q.h,H),ov=Math.max(0,h1-(H-a));lo-=L*ov;up-=L*(a-ov)}
    const rv=st.rv||'Não definido',rs=st.rvS||'Pintura';
    rows.push({i,name:WN(r,i),rv,faixa:h1<H?'0 a '+fl(h1):'parede toda',area:Math.max(0,lo)});addT(rv,Math.max(0,lo));
    if(h1<H){rows.push({i,name:WN(r,i),rv:rs,faixa:fl(h1)+' a '+fl(H),area:Math.max(0,up)});addT(rs,Math.max(0,up))}});
  if(r.openings.some(o=>o.wall==null&&o.w>0))warn.push('Aberturas sem parede definida não foram descontadas do revestimento.');
  return{rows,tot,warn}}

  for(const r of p.rooms){const c=calc(r);res.push([r.name,R3(r.h),R3(c.area),R3(c.teto),R3(c.perim),R3(c.gross),R3(c.openA),R3(c.net),R3(c.rodape),R3(c.vol),R3(c.g.err)])}
  const t=totals(p);res.push(['TOTAL',null,R3(t.area),R3(t.perim),R3(t.gross),R3(t.openA),R3(t.net),R3(t.rodape),R3(t.vol),null]);
  const wl=[['Cômodo','Parede','Real (m)','Projeto (m)','Δ (cm)','Giro após (°)','Alvenaria (m)','Shaft (m)']];for(const r of p.rooms){const cc=calc(r);if(r.h!=null||r.hPj!=null)wl.push([r.name,'Pé-direito',R3(r.h),R3(r.hPj),dcs(r.h,r.hPj)==null?null:+dcs(r.h,r.hPj).toFixed(1),null]);(r.extras||[]).filter(e=>e.len>0).forEach((e,k)=>wl.push([r.name,'PE'+(k+1)+' (extra)',R3(e.len),null,null,null,null,null]));walls(r).forEach((w,i)=>{const pj=wallPj(r,i),dc=dcs(w.len,pj);wl.push([r.name,WN(r,i)+(WK(w)!=='p'?' ('+WKL[WK(w)]+')':''),R3(w.len),R3(pj),dc==null?null:+dc.toFixed(1),r.mode==='rect'?90:+w.ang,R3(cc.netW[i]),R3(cc.cut[i])])})}
  const op=[['Cômodo','Tipo','Parede','Qtd','Largura (m)','Largura proj. (m)','Altura (m)','Altura proj. (m)','Dist. início (m)','Dist. início proj. (m)','Área total (m²)']];for(const r of p.rooms)r.openings.forEach(o=>op.push([r.name,o.t,o.wall==null?'':WN(r,o.wall),o.q||1,R3(o.w),R3(o.wPj),R3(o.h),R3(o.hPj),R3(o.off),R3(o.offPj),R3((o.w||0)*(o.h||0)*(o.q||1))]));
  const sx=[['Cômodo','Shaft','Canto','Ao longo de','Real (m)','Projeto (m)','Δ (cm)']];for(const r of p.rooms){const n=calc(r).g.ws.length;(r.shafts||[]).forEach((sh,i)=>{if(!n)return;const k=sh.corner;
    sx.push([r.name,'SH'+(i+1),WN(r,k)+'/'+WN(r,(k+1)%n),WN(r,k),R3(sh.a),R3(sh.aPj),dcs(sh.a,sh.aPj)==null?null:+dcs(sh.a,sh.aPj).toFixed(1)]);
    sx.push([r.name,'SH'+(i+1),WN(r,k)+'/'+WN(r,(k+1)%n),WN(r,(k+1)%n),R3(sh.b),R3(sh.bPj),dcs(sh.b,sh.bPj)==null?null:+dcs(sh.b,sh.bPj).toFixed(1)])})}
  const scx=[['Cômodo','Sanca','Canto','Lado 1 (m)','Lado 2 (m)','Largura (m)','Altura (m)','Linear (m)','Bandeja (m²)','Fechamento linear (m²)']];for(const r of p.rooms){const g=geom(r);(r.sancas||[]).forEach((sc,k)=>{const q=scGeo(sc,g.ws);if(!q)return;
    scx.push([r.name,'SC'+(k+1),WN(r,q.k)+'/'+WN(r,q.k2),R3(q.La),R3(q.Lb),R3(q.w),R3(q.h),R3(q.L),R3(q.forro),R3(q.test)])})}
  const rqx=[['Cômodo','Item','Lat. esq. (m)','Lat. dir. (m)','Topo (m)','Qtd','Linear (m)','Espessura (m)','Área (m²)']];for(const r of p.rooms)rqTot(r).it.forEach(x=>rqx.push([r.name,x.nome,R3(x.rq.e),R3(x.rq.d),R3(x.rq.t),x.q,R3(x.l),R3(x.rq.esp),R3(x.a)]));
  const rvx=[['Cômodo','Parede','Revestimento','Faixa (m)','Área (m²)']];for(const r of p.rooms)revAreas(r).rows.forEach(x=>rvx.push([r.name,x.name,x.rv,x.faixa,R3(x.area)]));
  const ob=[['Cômodo','Objeto','C (m)','L (m)','A (m)','Área (m²)','Volume (m³)']];for(const r of p.rooms)r.objects.forEach(o=>ob.push([r.name,o.n||'',R3(o.a),R3(o.b),R3(o.c),R3((o.a||0)*(o.b||0)),R3((o.a||0)*(o.b||0)*(o.c||0))]));
  const fr=[['Data/hora','Descrição','Medida (m)']];S.free.filter(f=>f.pid===p.id).forEach(f=>fr.push([new Date(f.t).toLocaleString('pt-BR'),f.label||'',R3(f.v)]));
  const px=[['Planta','Cota','Categoria','Descrição','Projeto (m)','Real (m)','Δ (cm)','Status','Fotos']];
  for(const pl of p.photos.filter(f=>f.kind==='plan'))pl.dims.forEach((d,i)=>{const dc=deltaCm(pl,d),ok=okD(dc);px.push([pl.name,'C'+(i+1),d.ref?'Escala':CATS[d.cat||'outro'],d.label||'',R3(projOf(pl,d)),R3(d.val),dc==null?null:+dc.toFixed(1),ok==null?'':ok?'OK':'FORA',(d.ph||[]).length])});
  return{Resumo:res,'Projeto x Real':px,Paredes:wl,Aberturas:op,Shafts:sx,Sancas:scx,Revestimentos:rvx,Requadros:rqx,Objetos:ob,Avulsas:fr}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportXlsx(p){const sh=rowsFor(p);try{if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.utils.book_new();for(const[n,rows]of Object.entries(sh)){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((h,i)=>({wch:i===0?24:Math.max(12,String(h).length+2)}));XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))}
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});await saveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),slug(p.name)+'_medicoes.xlsx')}
  catch(e){toast('Sem internet para gerar .xlsx — gerei CSV');exportCsv(p)}}
function exportCsv(p){const sh=rowsFor(p);const cell=v=>v==null?'':typeof v==='number'?String(v).replace('.',','):'"'+String(v).replace(/"/g,'""')+'"';
  let s='﻿';for(const[n,rows]of Object.entries(sh)){s+=cell(n.toUpperCase())+'\n'+rows.map(r=>r.map(cell).join(';')).join('\n')+'\n\n'}
  saveBlob(new Blob([s],{type:'text/csv;charset=utf-8'}),slug(p.name)+'_medicoes.csv')}
async function exportBackup(){const ph={};for(const p of S.projects)for(const f of p.photos){const d=await idb.get(f.id);if(d)ph[f.id]=d}
  saveBlob(new Blob([JSON.stringify({app:'cotalaser',v:1,data:S,photos:ph})],{type:'application/json'}),'cotalaser_backup_'+new Date().toISOString().slice(0,10)+'.json')}
async function importBackup(file){try{const j=JSON.parse(await file.text());if(j.app!=='cotalaser'||!j.data)throw 0;
  const ids=new Set(S.projects.map(p=>p.id));for(const p of j.data.projects)if(!ids.has(p.id))S.projects.push(p);
  S.free=S.free.concat((j.data.free||[]).filter(f=>!S.free.some(x=>x.id===f.id)));for(const[k,v]of Object.entries(j.photos||{}))await idb.put(k,v);save();toast('Backup importado');render()}
  catch(e){toast('Arquivo inválido: use um backup gerado pelo Trenout')}}

/* ===== trena Bosch GLM (BLE) ===== */
const SVC='02a6c0d0-0451-4000-b000-fb3210111989',CHR='02a6c0d1-0451-4000-b000-fb3210111989';
const BT={dev:null,chr:null,state:'off',log:[],last:null,wake:null,
  hex:dv=>Array.from(new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength)).map(b=>b.toString(16).padStart(2,'0')).join(' '),
  push(m){this.log.unshift(new Date().toLocaleTimeString('pt-BR')+'  '+m);this.log.length=Math.min(this.log.length,40);const el=$('#btlog');if(el)el.textContent=this.log.join('\n')},
  set(s){this.state=s;updateDock()},
  async connect(all=false){
    if(!navigator.bluetooth){toast('Bluetooth indisponível aqui. Abra pelo link https no Chrome do Android.');return}
    try{this.set('busy');
      this.dev=await navigator.bluetooth.requestDevice(all?{acceptAllDevices:true,optionalServices:[SVC]}:{filters:[{namePrefix:'GLM'},{namePrefix:'Bosch'},{namePrefix:'BOSCH'},{services:[SVC]}],optionalServices:[SVC]});
      this.push('escolhido: '+(this.dev.name||'(sem nome)'));
      this.dev.addEventListener('gattserverdisconnected',()=>this.lost());
      await this.link();
    }catch(e){this.push('ERRO '+(e.message||e));this.set(this.chr?'on':'off');if(e.name!=='NotFoundError')toast('Falha ao conectar: '+(e.message||e))}},
  async link(){const sv=await this.dev.gatt.connect();const s=await sv.getPrimaryService(SVC);this.chr=await s.getCharacteristic(CHR);
    this.chr.addEventListener('characteristicvaluechanged',e=>this.onVal(e.target.value));
    await this.chr.startNotifications();await sleep(400);
    await this.chr.writeValueWithResponse(new Uint8Array([0xc0,0x55,0x02,0x01,0x00,0x1a]));
    this.push('conectado: '+(this.dev.name||'GLM'));this.set('on');toast('Trena conectada. Aperte medir na trena.');
    try{if(S.settings.wake)this.wake=await navigator.wakeLock.request('screen')}catch(e){}},
  onVal(dv){this.push('rx '+this.hex(dv));
    if(dv.byteLength>=11&&dv.getUint8(0)===0xc0&&dv.getUint8(1)===0x55&&dv.getUint8(2)===0x10&&dv.getUint8(3)===0x06){
      const m=dv.getFloat32(7,true);if(isFinite(m)&&m>0&&m<300)reading(m,true)}},
  async lost(){this.chr=null;this.set('busy');this.push('conexão perdida, tentando reconectar…');
    for(let i=0;i<3;i++){try{await sleep(800);await this.link();return}catch(e){}}
    this.set('off');toast('Trena desconectada')},
  disconnect(){try{this.dev&&this.dev.gatt.connected&&this.dev.gatt.disconnect()}catch(e){}this.dev=null;this.chr=null;this.set('off')}};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&BT.state==='on'){try{BT.wake=await navigator.wakeLock.request('screen')}catch(e){}}});

let REG=new Map(),ORDER=[],target=null;
function F(key,label,val,set){REG.set(key,{label,set});ORDER.push(key);
  return`<button type="button" class="mf${target===key?' on':''}${val==null?' empty':''}" data-t="${esc(key)}"><span class="mfl">${esc(label)}</span><span class="mfv">${val==null?'—':fl(val)}</span></button>`}
function reading(m,fromLaser){m=Math.round(m*1000)/1000;BT.last=m;
  const l=$('#lcd');l.classList.remove('flash');void l.offsetWidth;l.classList.add('flash');if(fromLaser&&S.settings.vib&&navigator.vibrate)navigator.vibrate(35);
  if(target&&REG.has(target)){const k=target;REG.get(k).set(m);save();render();let i=ORDER.indexOf(k)+1;while(i>0&&i<ORDER.length&&/^rv:|:pe$/.test(ORDER[i]))i++;target=i>0&&ORDER[i]?ORDER[i]:null;render();
    if(target){const el=document.querySelector(`[data-t="${CSS.escape(target)}"]`);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
  else{S.free.unshift({id:uid(),pid:V.pid||null,v:m,label:'',t:Date.now()});save();toast('Medida avulsa salva: '+flu(m));if(V.v==='project'&&V.tab==='free'||V.v==='home')render()}
  updateDock()}
function updateDock(){$('#rv').textContent=BT.last==null?'—':fl(BT.last);$('#runit').textContent=UN();$('#man').placeholder='ou digite a medida ('+UN()+')';
  const d=$('#dot');d.className='dot'+(BT.state==='on'?' on':BT.state==='busy'?' busy':'');
  $('#bt').textContent=BT.state==='on'?'Desconectar':BT.state==='busy'?'Conectando…':'Conectar trena';$('#bt').classList.toggle('pri',BT.state!=='on');
  $('#tgt').innerHTML=target&&REG.has(target)?'Leitura → <b>'+esc(REG.get(target).label)+'</b>':'Leitura → <b>avulsa</b>'}

let V={v:'home'};const HIST=[];
function go(nv,push=true){ED.styleOpen=false;if(push)HIST.push(V);V=Object.assign({},nv);target=null;render();window.scrollTo(0,0)}
function back(){ED.styleOpen=false;V=HIST.pop()||{v:'home'};target=null;render()}
$('#back').onclick=back;
function renameObj(){const p=P(V.pid);if(!p)return null;if(V.v==='project')return p;if(V.v==='room')return R(p,V.rid);if(V.v==='photo')return p.photos.find(x=>x.id===V.phid);return null}
$('#ttl').onclick=()=>{const o=renameObj();if(!o)return;const t=$('#ttl'),i=$('#ttlin');i.value=o.name;t.hidden=true;i.hidden=false;i.focus();i.select()};
const ttlDone=()=>{const i=$('#ttlin');if(i.hidden)return;const o=renameObj(),v=i.value.trim();if(o&&v){o.name=v;save()}i.hidden=true;render()};
$('#ttlin').addEventListener('blur',ttlDone);$('#ttlin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#ttlin').blur()}if(e.key==='Escape'){$('#ttlin').value='';$('#ttlin').blur()}});$('#gear').onclick=()=>go({v:'cfg'});

function render(){REG=new Map();ORDER=[];const app=$('#app');let h='';
  const p=P(V.pid),r=R(p,V.rid);
  if(V.v!=='home'&&V.v!=='cfg'&&!p){V={v:'home'}}
  $('#back').hidden=V.v==='home';
  $('#gear').hidden=V.v!=='home';$('#ttl').classList.toggle('ed',['project','room','photo'].includes(V.v));$('#ttl').hidden=false;$('#ttlin').hidden=true;
  if(V.v==='home'){$('#ttl').textContent='Trenout';h=vHome()}
  else if(V.v==='cfg'){$('#ttl').textContent='Ajustes';h=vCfg()}
  else if(V.v==='project'){$('#ttl').textContent=p.name;h=vProject(p)}
  else if(V.v==='room'&&r){$('#ttl').textContent=r.name;h=vRoom(p,r)}
  else if(V.v==='photo'){const ph=p.photos.find(x=>x.id===V.phid);$('#ttl').textContent=ph?ph.name:'Foto';h=ph?vPhoto(p,ph):''}
  else if(V.v==='report'){$('#ttl').textContent='Relatório';h=vReport(p)}
  else{V={v:'project',pid:p.id};return render()}
  app.innerHTML=h;if(target&&!REG.has(target))target=null;updateDock();after()}
function after(){RT=null;GR=null;hideLoupe();if(V.v==='project'&&V.tab==='geral')setupGeral();if(V.v==='photo')setupEditor();if(V.v==='report')fillReportPhotos()}

function cropRects(sh){const W=sh.w,H=sh.h,M=Math.max(W,H),m=0.05*M,mn=0.14*M;
  let R=sh.dims.map(d=>{let x0=Math.min(d.x1,d.x2),x1=Math.max(d.x1,d.x2),y0=Math.min(d.y1,d.y2),y1=Math.max(d.y1,d.y2);
    if(d.lo){const cx=(d.x1+d.x2)/2+d.lo[0],cy=(d.y1+d.y2)/2+d.lo[1];x0=Math.min(x0,cx);x1=Math.max(x1,cx);y0=Math.min(y0,cy);y1=Math.max(y1,cy)}
    return[x0-m,y0-m,x1+m,y1+m]});
  let merged=true;while(merged){merged=false;for(let i=0;i<R.length&&!merged;i++)for(let j=i+1;j<R.length;j++){const a=R[i],b=R[j];
    if(a[0]<=b[2]&&b[0]<=a[2]&&a[1]<=b[3]&&b[1]<=a[3]){R[i]=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[2],b[2]),Math.max(a[3],b[3])];R.splice(j,1);merged=true;break}}}
  return R.map(([x0,y0,x1,y1])=>{let w=x1-x0,h=y1-y0;if(w<mn){x0-=(mn-w)/2;w=mn}if(h<mn){y0-=(mn-h)/2;h=mn}
    if(w/h>2.2){const nh=w/2.2;y0-=(nh-h)/2;h=nh}if(h/w>1.6){const nw=h/1.6;x0-=(nw-w)/2;w=nw}
    x0=Math.max(0,Math.min(W-w,x0));y0=Math.max(0,Math.min(H-h,y0));w=Math.min(w,W);h=Math.min(h,H);return[x0,y0,w,h]})}

      const L=Math.hypot(d.x2-d.x1,d.y2-d.y1)||1,nx=-(d.y2-d.y1)/L,ny=(d.x2-d.x1)/L;let pn_=v[0]*nx+v[1]*ny,pt_=v[0]*(-ny)+v[1]*nx;const st=b.h*0.8;
      const k=t.dataset.k;if(k==='flip')pn_=-pn_;if(k==='in')pn_=Math.abs(pn_)<=st?0:pn_-Math.sign(pn_)*st;if(k==='out')pn_=pn_+(pn_>=0?1:-1)*st;if(k==='on')pn_=0;

    case'addSh2':{const n=calc(r).g.ws.length;(r.shafts=r.shafts||[]).push({id:uid(),corner:0,a:null,b:null});save();target='s:'+(r.shafts.length-1)+':a';return render()}

    case'dHide':{const sh=p.photos.find(x=>x.id===V.phid);sh.dims[i].hide=!sh.dims[i].hide;save();return render()}

    case'delP':if(!armed())return;for(const f of p.photos)idb.del(f.id);S.projects=S.projects.filter(x=>x!==p);S.free=S.free.filter(f=>f.pid!==p.id);save();HIST.length=0;return go({v:'home'},false);

    case'delR':if(!armed())return;p.rooms=p.rooms.filter(x=>x!==r);save();return back();
    case'mode':r.mode=t.dataset.k;if(r.mode==='poly'&&!r.walls.some(w=>w.len>0)&&r.a&&r.b)r.walls=[{len:r.a,ang:90},{len:r.b,ang:90},{len:r.a,ang:90},{len:r.b,ang:90},{len:null,ang:90}];save();return render();
    case'addW':{if(typeof INS==='string'&&INS[0]==='c'){const k=+INS.slice(1),at=k+1,w=r.walls[k];if(!w)return;
        r.walls.splice(at,0,{len:null,ang:w.ang,sub:true,kind:w.kind,rv:w.rv,rvH:w.rvH,rvS:w.rvS});w.ang=0;
        r.openings.forEach(o=>{if(o.wall!=null&&o.wall>=at)o.wall++});(r.shafts||[]).forEach(sh=>{if(sh.corner!=null&&sh.corner>=at)sh.corner++});(r.sancas||[]).forEach(sc=>{if(sc.corner!=null&&sc.corner>=at)sc.corner++});
        if(r.wph){const n={};for(const key in r.wph)n[+key>=at?+key+1:key]=r.wph[key];r.wph=n}target='w:'+at;INS='end';save();return render()}

      if(k==null){const lw=r.walls[r.walls.length-1];if(lw&&!(lw.len>0)){target='w:'+(r.walls.length-1);return render()}r.walls.push({len:null,ang:90});target='w:'+(r.walls.length-1)}
      else{const at=k+1;r.walls.splice(at,0,{len:null,ang:0});r.openings.forEach(o=>{if(o.wall!=null&&o.wall>=at)o.wall++});(r.shafts||[]).forEach(sh=>{if(sh.corner!=null&&sh.corner>=at)sh.corner++});(r.sancas||[]).forEach(sc=>{if(sc.corner!=null&&sc.corner>=at)sc.corner++});
        if(r.wph){const n={};for(const key in r.wph)n[+key>=at?+key+1:key]=r.wph[key];r.wph=n}target='w:'+at}
      INS='end';save();return render()}
    case'delW':r.walls.splice(i,1);if(!r.walls.length)r.walls.push({len:null,ang:90});r.openings.forEach(o=>{if(o.wall===i)o.wall=null;else if(o.wall>i)o.wall--});
      (r.shafts||[]).forEach(sh=>{if(sh.corner!=null&&sh.corner>=i&&sh.corner>0)sh.corner--});(r.sancas||[]).forEach(sc=>{if(sc.corner!=null&&sc.corner>=i&&sc.corner>0)sc.corner--});if(r.wph){const n={};for(const key in r.wph){if(+key===i)continue;n[+key>i?+key-1:key]=r.wph[key]}r.wph=n}save();return render();
    case'addO':r.openings.push({id:uid(),t:t.dataset.k,w:null,h:null,q:1,wall:null});save();target='o:'+(r.openings.length-1)+':w';return render();

    case'copySum':{const c=calc(r);const s=`${r.name}\nPé-direito: ${flu(r.h)}\nÁrea piso: ${nf(c.area,2)} m²\nPerímetro: ${flu(c.perim)}\nParede bruta: ${nf(c.gross,2)} m²\nAberturas: ${nf(c.openA,2)} m²\nParede líquida: ${nf(c.net,2)} m²\nRodapé: ${flu(c.rodape)}\nVolume: ${nf(c.vol,2)} m³`;

document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;if(!a&&!t.id)return;const p=P(V.pid),r=R(p,V.rid),i=+t.dataset.i;
  const ph=p&&p.photos.find(x=>x.id===V.phid);
  switch(a){
    case'ang':if(t.value==='x'){r.walls[i].ang=+r.walls[i].ang+0.0001}else r.walls[i].ang=+t.value;break;
    case'angx':{const v=pn(t.value);if(v!=null)r.walls[i].ang=v;break}
    case'oT':r.openings[i].t=t.value;break;
    case'oW':r.openings[i].wall=t.value===''?null:+t.value;break;
    case'oQ':r.openings[i].q=Math.max(1,parseInt(t.value)||1);break;
    case'obN':r.objects[i].n=t.value;break;
    case'pname':p.name=t.value.trim()||p.name;break;
    case'freeLbl':{const f=S.free.find(x=>x.id===t.dataset.id);if(f)f.label=t.value;save();return}
    case'phName':ph.name=t.value.trim()||ph.name;break;

    case'lastCat':ED.lastCat=t.value;return;
    case'dProj':ph.dims[i].proj=parseL(t.value);if(ph.dims[i].ref&&!(ph.dims[i].proj>0))ph.dims[i].ref=false;break;

    case'exDir':r.extras[i].dir=+t.value;break;
    case'scC':r.sancas[i].corner=+t.value;break;
    case'rv':WS(r,i)[t.dataset.k]=t.value||null;break;
    case'rqOn':{const o=rqHost(t.dataset.k);if(!o)return;o.rq=o.rq||{};o.rq.on=t.checked;if(t.checked&&!o.rq.e&&!o.rq.t)target='q:'+t.dataset.k+':e';break}
    case'shC':r.shafts[i].corner=+t.value;break;
    case'pj':setPj(r,t.dataset.k,parseL(t.value));break;
    case'dRef':if(t.checked){if(!(ph.dims[i].proj>0)){t.checked=false;toast('Digite primeiro a medida do projeto desta cota');return}ph.dims.forEach((d,k)=>d.ref=k===i)}else ph.dims[i].ref=false;break;
    default:
      if(t.id==='insAt'){INS=t.value;return}
      if(t.id==='gStep'){GV.step=+t.value;return}
      if(t.id==='sfmt'){S.settings.fmt=t.value;S.settings.dec=3;break}
      if(t.id==='svib'){S.settings.vib=t.checked;break}
      if(t.id==='swake'){S.settings.wake=t.checked;break}
      if(t.id==='stol'){S.settings.tol=Math.max(0,pn(t.value)||0);break}
      if(['stLw','stFs','stZr','stFont','stColX','stOrtho','stEnd','stDash','stBg','stTxt','stLine'].includes(t.id)){const k={stZr:'zref',stLw:'lw',stFs:'fs',stFont:'font',stColX:'color',stOrtho:'ortho',stEnd:'end',stDash:'dash',stBg:'bg',stTxt:'txt',stLine:'line'}[t.id];ph.style=Object.assign(stOf(ph),{[k]:t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value});
        if(k==='color')ph.dims.forEach(d=>d.color=null);if(k==='line')ph.dims.forEach(d=>d.hide=false);break}
      if(t.id==='fileplan'&&t.files[0]){addPlan(t.files[0]);t.value='';return}

  save();render()});
